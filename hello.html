<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World — Vibe Coding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --text: #ededed;
      --text-muted: #888891;
      --accent: #3b82f6;
      --glow: rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Center Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(59, 130, 246, 0.05) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2.2rem;
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    /* Main Hero */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 6.5vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
      color: #ffffff;
    }

    .hero p {
      font-size: 1.12rem;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.6;
      font-weight: 400;
    }

    /* Minimal Card */
    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.8rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      transition: border-color 0.2s ease;
      text-align: left;
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .quote-box {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      min-height: 52px;
      display: flex;
      align-items: center;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      margin-top: 0.2rem;
    }

    .vibe-count {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .vibe-count strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Clean Buttons */
    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    /* Minimal Footer */
    footer {
      font-size: 0.8rem;
      color: #55555c;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <main class="wrapper">
    <div class="badge">
      <span class="dot"></span>
      <span>Vibe Coding Active</span>
    </div>

    <section class="hero">
      <h1>Hello, World.</h1>
      <p>상상을 코드로 바로 옮기는 바이브 코딩이 시작되었습니다.<br>직관을 믿고 자유롭게 만들어보세요.</p>
    </section>

    <div class="card">
      <div class="card-top">
        <span class="card-title">Today's Vibe</span>
        <button class="btn-action" id="nextQuoteBtn">다음 문구 ↻</button>
      </div>

      <div class="quote-box" id="quoteText">
        "구현 디테일은 AI에게 맡기고, 당신은 비전과 설계에 집중하세요."
      </div>

      <div class="card-footer">
        <span class="vibe-count">바이브 카운트: <strong id="clickCount">1</strong></span>
        <button class="btn-action" id="boostBtn">⚡ 바이브 +1</button>
      </div>
    </div>

    <footer>
      Minimal & Clean • Ready to Build
    </footer>
  </main>

  <script>
    const quotes = [
      "\"구현 디테일은 AI에게 맡기고, 당신은 비전과 설계에 집중하세요.\"",
      "\"생각의 속도로 아이디어를 실체화하는 경험을 즐겨보세요.\"",
      "\"에러를 두려워하지 말고, AI와 대화하듯 편하게 풀어가세요.\"",
      "\"완벽함보다 빠른 실행과 피드백이 더 중요합니다.\"",
      "\"당신의 상상력이 곧 소프트웨어의 한계입니다.\""
    ];

    let currentIdx = 0;
    let count = 1;

    const quoteText = document.getElementById('quoteText');
    const nextBtn = document.getElementById('nextQuoteBtn');
    const boostBtn = document.getElementById('boostBtn');
    const clickCount = document.getElementById('clickCount');

    nextBtn.addEventListener('click', () => {
      currentIdx = (currentIdx + 1) % quotes.length;
      quoteText.style.opacity = 0;
      setTimeout(() => {
        quoteText.textContent = quotes[currentIdx];
        quoteText.style.opacity = 1;
      }, 150);
    });

    boostBtn.addEventListener('click', () => {
      count++;
      clickCount.textContent = count;
      
      // 차분하고 은은한 클릭 피드백
      boostBtn.style.transform = 'scale(0.95)';
      setTimeout(() => {
        boostBtn.style.transform = 'scale(1)';
      }, 100);
    });
  </script>
</body>
</html>
