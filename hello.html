<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World — Vibe Coding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text: #ededed;
      --text-muted: #888891;
      --accent: #3b82f6;
      --accent-cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Center Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(59, 130, 246, 0.04) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2rem;
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    /* Main Hero Title */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5.5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
      color: #ffffff;
    }

    .hero p {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      font-weight: 400;
    }

    /* Central Time, Date, Location Widget */
    .live-widget {
      width: 100%;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.25s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .live-widget:hover {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.035);
    }

    .clock-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2.8rem, 8vw, 4.4rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 20px rgba(255, 255, 255, 0.1);
    }

    .clock-seconds {
      font-size: 0.55em;
      color: var(--accent-cyan);
      font-weight: 400;
      margin-left: 2px;
    }

    .date-display {
      font-size: 1.05rem;
      font-weight: 500;
      color: #e2e8f0;
      letter-spacing: -0.01em;
    }

    .location-display {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 5px 12px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 0.3rem;
    }

    .location-icon {
      font-size: 0.85rem;
      color: #ef4444;
    }

    /* Minimal Quote / Vibe Card */
    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .quote-box {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 0.85rem;
    }

    .vibe-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .vibe-count strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Clean Buttons */
    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    /* Minimal Footer */
    footer {
      font-size: 0.78rem;
      color: #4b4b55;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <main class="wrapper">
    <div class="badge">
      <span class="dot"></span>
      <span>Vibe Coding Active</span>
    </div>

    <section class="hero">
      <h1>Hello, World.</h1>
      <p>상상을 코드로 실체화하는 바이브 코딩의 순간</p>
    </section>

    <!-- Central Live Time / Date / Location Widget -->
    <div class="live-widget">
      <div class="clock-display" id="clockDisplay">
        <span id="timeMain">00:00</span><span class="clock-seconds" id="timeSec">:00</span>
      </div>
      <div class="date-display" id="dateDisplay">
        2026년 8월 18일 화요일
      </div>
      <div class="location-display" id="locationDisplay">
        <span class="location-icon">📍</span>
        <span id="locationText">대한민국 서울 (Asia/Seoul)</span>
      </div>
    </div>

    <!-- Minimal Quote Card -->
    <div class="card">
      <div class="card-top">
        <span class="card-title">Today's Vibe</span>
        <button class="btn-action" id="nextQuoteBtn">다음 문구 ↻</button>
      </div>

      <div class="quote-box" id="quoteText">
        "구현 디테일은 AI에게 맡기고, 당신은 비전과 설계에 집중하세요."
      </div>

      <div class="card-footer">
        <span class="vibe-count">바이브 카운트: <strong id="clickCount">1</strong></span>
        <button class="btn-action" id="boostBtn">⚡ 바이브 +1</button>
      </div>
    </div>

    <footer>
      Minimal & Clean • Ready to Build
    </footer>
  </main>

  <script>
    // --- 1. Real-time Clock & Date ---
    function updateClock() {
      const now = new Date();
      
      // Hours, Minutes, Seconds
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('timeMain').textContent = `${hours}:${minutes}`;
      document.getElementById('timeSec').textContent = `:${seconds}`;

      // Date Formatting in Korean
      const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayName = days[now.getDay()];

      document.getElementById('dateDisplay').textContent = `${year}년 ${month}월 ${date}일 ${dayName}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // --- 2. Location Detection (Timezone + Geolocation fallback) ---
    function detectLocation() {
      const locationText = document.getElementById('locationText');
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      
      let friendlyLocation = tz;
      if (tz === 'Asia/Seoul') {
        friendlyLocation = '대한민국 서울 (Asia/Seoul)';
      } else {
        friendlyLocation = tz.replace('_', ' ');
      }
      locationText.textContent = friendlyLocation;

      // Try browser Geolocation for enhanced local experience if granted
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const { latitude, longitude } = position.coords;
            try {
              // OpenStreetMap reverse geocoding
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&accept-language=ko`);
              if (res.ok) {
                const data = await res.json();
                const address = data.address;
                const city = address.city || address.province || address.town || address.county || '';
                const country = address.country || '';
                if (city || country) {
                  locationText.textContent = `${country} ${city}`.trim() + ` (${tz})`;
                }
              }
            } catch (e) {
              // fallback to timezone
            }
          },
          () => {
            // Permission denied or error, keep timezone display
          },
          { timeout: 5000 }
        );
      }
    }
    detectLocation();

    // --- 3. Quotes & Interaction ---
    const quotes = [
      "\"구현 디테일은 AI에게 맡기고, 당신은 비전과 설계에 집중하세요.\"",
      "\"생각의 속도로 아이디어를 실체화하는 경험을 즐겨보세요.\"",
      "\"에러를 두려워하지 말고, AI와 대화하듯 편하게 풀어가세요.\"",
      "\"완벽함보다 빠른 실행과 피드백이 더 중요합니다.\"",
      "\"당신의 상상력이 곧 소프트웨어의 한계입니다.\""
    ];

    let currentIdx = 0;
    let count = 1;

    const quoteText = document.getElementById('quoteText');
    const nextBtn = document.getElementById('nextQuoteBtn');
    const boostBtn = document.getElementById('boostBtn');
    const clickCount = document.getElementById('clickCount');

    nextBtn.addEventListener('click', () => {
      currentIdx = (currentIdx + 1) % quotes.length;
      quoteText.style.opacity = 0;
      setTimeout(() => {
        quoteText.textContent = quotes[currentIdx];
        quoteText.style.opacity = 1;
      }, 150);
    });

    boostBtn.addEventListener('click', () => {
      count++;
      clickCount.textContent = count;
      boostBtn.style.transform = 'scale(0.95)';
      setTimeout(() => {
        boostBtn.style.transform = 'scale(1)';
      }, 100);
    });
  </script>
</body>
</html>
